# JUL configuration for benchmark runs - suppress JMH noise
handlers = java.util.logging.ConsoleHandler
.level = WARNING

java.util.logging.ConsoleHandler.level = WARNING
java.util.logging.ConsoleHandler.formatter = java.util.logging.SimpleFormatter

# Allow benchmark runner info messages
de.cuioss.http.security.benchmark.level = INFO

# The forwarded resolver warns on precisely the attack inputs the forwarded attack
# benchmark cycles, so under the inherited WARNING level every measured iteration
# emits a console record and the attack-throughput measurement becomes console-bound
# (it measures the JUL ConsoleHandler, not the resolver). SEVERE suppresses those
# per-iteration warnings without touching the root level or the ConsoleHandler.
de.cuioss.http.forwarded.level = SEVERE
